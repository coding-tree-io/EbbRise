[package]
name = "app"
version = "0.4.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "ebbrise"
path = "src/main.rs"

[dependencies]
settings = { path = "../settings" }
breaks = { path = "../breaks" }
commands = { path = "../commands" }
i18n = { path = "../i18n" }
ideas = { path = "../ideas" }
fastrand = "=2.5.0"
platform = { path = "../platform" }
jiff = "=0.2.41"
resvg = { version = "=0.48.1", default-features = false }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tray-icon = { version = "=0.26.1", default-features = false }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std"] }
slint = "=1.18.1"

[build-dependencies]
slint-build = "=1.18.1"
resvg = { version = "=0.48.1", default-features = false }

[dev-dependencies]
cargo_metadata = "=0.19.2"

[lints]
workspace = true
