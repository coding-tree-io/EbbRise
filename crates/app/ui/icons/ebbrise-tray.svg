  <circle cx="16" cy="16" r="16" fill="#0F1612"/>
  <g clip-path="url(#inside)">
    <rect width="32" height="32" fill="#D8C9A3"/>
    <rect y="13" width="32" height="19" fill="#8C7B5A"/>
    <rect y="19" width="32" height="13" fill="#67A97F"/>
    <rect y="23" width="32" height="9" fill="#1E4A3A"/>
  </g>
  <circle cx="16" cy="16" r="12.6" fill="none" stroke="#ABF1C3" stroke-width="2.2"/>
</svg>
