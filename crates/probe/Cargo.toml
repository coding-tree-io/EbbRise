[package]
name = "probe"
version = "0.1.0"
edition = "2021"
publish = false

# Throwaway: proves the Windows signals and the shared Slint loop (ADR 0002). Delete once `platform` exists.

[dependencies]
global-hotkey = "=0.9.0"
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software"] }
tauri-winrt-notification = "=0.8.1"
tray-icon = { version = "=0.26.1", default-features = false }
windows = { version = "=0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
