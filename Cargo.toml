[workspace]
members = ["crates/settings", "crates/breaks", "crates/commands", "crates/platform", "crates/app", "crates/i18n", "crates/ideas"]
resolver = "3"

[workspace.package]
edition = "2024"
# Our code is 0BSD; the parts ported from Stretchly keep its BSD-2-Clause notice (LICENSE-STRETCHLY).
license = "0BSD AND BSD-2-Clause"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
undocumented_unsafe_blocks = "warn"
cognitive_complexity = "warn"
too_many_lines = "warn"
too_many_arguments = "warn"
excessive_nesting = "warn"
