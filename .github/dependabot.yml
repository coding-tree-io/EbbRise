version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    # The manifests pin exact versions (=x.y.z), so raise the pin.
    versioning-strategy: increase
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: "chore(deps)"
    groups:
      slint:
        patterns: ["slint*", "i-slint-*"]
        update-types: [minor, patch]
      windows:
        patterns: ["windows*", "tauri-winrt-notification"]
        update-types: [minor, patch]
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    labels: [dependencies, github-actions]
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        update-types: [minor, patch]
