# cargo-deny policy: https://embarkstudios.github.io/cargo-deny/
# Run: cargo deny check

[graph]
# EbbRise ships for Windows only, so only what goes into that exe is checked.
targets = ["x86_64-pc-windows-msvc"]

[advisories]
# Known vulnerabilities and unmaintained crates fail the check.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Every license that appears in the Windows build. Slint is offered under three licenses;
# EbbRise uses the royalty-free one, and GPL-3.0 is deliberately not allowed.
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "LicenseRef-Slint-Royalty-free-2.0",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
# Two versions of a crate are normal here (the UI stack pulls several). Do not fail on them.
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between our own crates carry no version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
